<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 — Ой, сервер немного прилёг... | АРХЕТИП</title>
    <style>
        :root {
            --brand-bg: #111111;
            --brand-light: #F8F7F2;
            --brand-accent: #ff6b35;
            --brand-muted: #888888;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--brand-bg);
            color: var(--brand-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            z-index: 10;
        }
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.1;
        }
        .glow {
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: var(--brand-accent);
            filter: blur(100px);
        }
        .code {
            font-size: 200px;
            font-weight: 800;
            opacity: 0.05;
            line-height: 1;
            margin-bottom: -150px;
            font-style: italic;
        }
        .gif-container {
            position: relative;
            margin-bottom: 40px;
        }
        img {
            width: 250px;
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .badge {
            position: absolute;
            bottom: -10px;
            right: 50%;
            transform: translateX(120px) rotate(6deg);
            background: white;
            color: black;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        p {
            color: var(--brand-muted);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--brand-accent);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 107, 53, 0.4);
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="glow" style="top: -10%; left: -10%;"></div>
        <div class="glow" style="bottom: -10%; right: -10%;"></div>
    </div>
    <div class="container">
        <div class="code">502</div>
        <div class="gif-container">
            <img src="https://vgif.ru/gifs/135/kot-upal-s-korobkoy.gif" alt="Котик упал">
            <div class="badge">Упс! Шкаф упал... 📦</div>
        </div>
        <h1>Наш сервер прилёг отдохнуть...</h1>
        <p>Он упал, но скоро встанет и будет ещё сильнее! Мы уже будим админа, чтобы он всё починил.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
