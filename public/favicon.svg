<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Solid deep luxury background for peak contrast in browser tabs, dark and light themes -->
  <rect width="120" height="120" rx="28" fill="#111111" />
  
  <!-- Subtle accent inner border in brand burgundy -->
  <rect x="6" y="6" width="108" height="108" rx="22" fill="none" stroke="#660010" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Custom Luxury Monogram "A" (АРХЕТИП) -->
  <g fill="#FCFBFA">
    <!-- Left diagonal stroke (slender, refined) -->
    <path d="M 58 32 L 62 32 L 40 86 Q 38 88 34 88 L 34 84 L 42 84 Z" />
    
    <!-- Right diagonal stroke (thick, high-contrast luxury serif weight) -->
    <path d="M 59.5 32 L 67 32 L 88 84 Q 92 84 94 86 L 94 88 L 74 88 L 74 84 L 80 84 Z" />
    
    <!-- horizontal Crossbar -->
    <rect x="47" y="67" width="28" height="3" />
    
    <!-- Top sharp serif joint and crown -->
    <path d="M 54 34 L 66 34 L 60 30 Z" />
    
    <!-- Left foot base serif -->
    <path d="M 32 88 L 46 88 L 39 84 Z" />
  </g>
  
  <!-- Brand accent ruby droplet (perfumery signature) -->
  <circle cx="84" cy="82" r="5" fill="#660010" />
</svg>
